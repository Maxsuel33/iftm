<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Extintores</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1e1e30;
    --card2: #26263d;
    --border: #35355a;
    --text: #f0f0f0;
    --muted: #9090b0;
    --green: #4ade80;
    --yellow: #fbbf24;
    --pink: #f472b6;

    /* cores por carga */
    --abc: #ff6b35;
    --bc:  #38bdf8;
    --co2: #a78bfa;
    --esp: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  header { text-align: center; margin-bottom: 36px; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff6b35, #e94e77);
    color: #fff; font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 4px 14px; border-radius: 20px; margin-bottom: 12px;
  }
  header h1 {
    font-size: clamp(22px, 5vw, 34px); font-weight: 800;
    background: linear-gradient(135deg, #ff6b35, #f7c59f, #e94e77);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1.2;
  }
  header p { color: var(--muted); margin-top: 8px; font-size: 14px; }

  /* SEÇÕES POR CARGA */
  .secao {
    max-width: 860px;
    margin: 0 auto 28px;
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .secao-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 22px;
    cursor: pointer;
    user-select: none;
  }
  .secao-header-left { display: flex; align-items: center; gap: 12px; }
  .secao-title {
    font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
  }
  .secao-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .toggle-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .toggle-btn:hover { background: rgba(255,255,255,0.13); }

  .secao-body { padding: 0 22px 22px; display: none; }
  .secao-body.aberto { display: block; }

  .qtd-row {
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap; margin-bottom: 18px;
  }
  .qtd-row label { color: var(--muted); font-size: 13px; }
  .qtd-ctrl {
    display: flex; align-items: center;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .qtd-ctrl button {
    background: none; border: none; font-size: 20px;
    width: 38px; height: 38px; cursor: pointer;
    transition: background .2s;
  }
  .qtd-ctrl button:hover { background: var(--border); }
  .qtd-ctrl input {
    background: none; border: none; color: var(--text);
    font-size: 15px; font-weight: 700; text-align: center;
    width: 46px; outline: none;
  }
  .qtd-ctrl input::-webkit-outer-spin-button,
  .qtd-ctrl input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .campos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .extintor-card {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
    transition: border-color .2s;
  }
  .extintor-card:hover { border-color: var(--accent-color); }
  .extintor-card h3 {
    font-size: 12px; font-weight: 700; margin-bottom: 12px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
  }
  .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px;
    padding: 7px 10px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: var(--accent-color); }
  .field input::placeholder { color: var(--border); }

  .btn-calc-secao {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: 1px; text-transform: uppercase;
    transition: opacity .2s, transform .1s;
  }
  .btn-calc-secao:hover { opacity: .88; transform: translateY(-1px); }
  .btn-calc-secao:active { transform: translateY(0); }

  /* RESULTADO */
  .resultado-secao { margin-top: 20px; }
  .info-bar {
    border-radius: 10px; padding: 12px 18px; margin-bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 18px;
    font-size: 13px; border: 1px solid var(--border);
    background: var(--card);
  }
  .info-bar .stat { display: flex; flex-direction: column; gap: 2px; }
  .info-bar .stat span:first-child { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .info-bar .stat span:last-child { font-weight: 700; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  thead tr { background: var(--card2); }
  th { padding: 10px 12px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); white-space: nowrap; }
  tbody tr { border-top: 1px solid var(--border); transition: background .15s; }
  tbody tr:hover { background: var(--card2); }
  td { padding: 10px 12px; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .tag-green { background: #0d2b1a; color: var(--green); border: 1px solid #1a4a2a; }
  .tag-orange { background: #2b1a0d; color: var(--yellow); border: 1px solid #4a2a1a; }
  .tag-pink   { background: #2b0d1a; color: var(--pink);  border: 1px solid #5a1a3a; }
  .menor-badge {
    font-size: 10px; color: #fff; padding: 1px 6px;
    border-radius: 8px; margin-left: 5px; vertical-align: middle;
  }

  /* cores por carga */
  .carga-abc { --accent-color: var(--abc); }
  .carga-bc  { --accent-color: var(--bc);  }
  .carga-co2 { --accent-color: var(--co2); }
  .carga-esp { --accent-color: var(--esp); }

  .carga-abc .secao-header { background: linear-gradient(135deg, #2b1a0d, #1e1e30); border-bottom: 1px solid #4a2a0d; }
  .carga-bc  .secao-header { background: linear-gradient(135deg, #0d1e2b, #1e1e30); border-bottom: 1px solid #0d2b4a; }
  .carga-co2 .secao-header { background: linear-gradient(135deg, #1a0d2b, #1e1e30); border-bottom: 1px solid #2a1a4a; }
  .carga-esp .secao-header { background: linear-gradient(135deg, #0d2b1e, #1e1e30); border-bottom: 1px solid #0d4a2a; }

  .carga-abc .secao-title { color: var(--abc); }
  .carga-bc  .secao-title { color: var(--bc);  }
  .carga-co2 .secao-title { color: var(--co2); }
  .carga-esp .secao-title { color: var(--esp); }

  .carga-abc .btn-calc-secao { background: linear-gradient(135deg, var(--abc), #e94e77); }
  .carga-bc  .btn-calc-secao { background: linear-gradient(135deg, var(--bc),  #0ea5e9); }
  .carga-co2 .btn-calc-secao { background: linear-gradient(135deg, var(--co2), #7c3aed); }
  .carga-esp .btn-calc-secao { background: linear-gradient(135deg, var(--esp), #059669); }

  .carga-abc .menor-badge { background: var(--abc); }
  .carga-bc  .menor-badge { background: var(--bc);  }
  .carga-co2 .menor-badge { background: var(--co2); }
  .carga-esp .menor-badge { background: var(--esp); }

  @media(max-width:500px){
    th, td { padding: 8px 7px; font-size: 11px; }
    .secao-header { padding: 14px 14px; }
    .secao-body { padding: 0 14px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="badge">🔥 Ferramenta Interna</div>
  <h1>Calculadora de Extintores</h1>
  <p>Separado por tipo de carga · Manutenção 40% · Pó/Recarga 60%</p>
</header>

<!-- SEÇÕES -->
<div id="secoes"></div>

<script>
const CARGAS = [
  { id: "abc", label: "ABC — Pó Químico ABC",    emoji: "🟠", sub: "Uso geral · maior valor de mercado" },
  { id: "bc",  label: "BC — Pó Químico BC",      emoji: "🔵", sub: "Líquidos e gases inflamáveis" },
  { id: "co2", label: "CO₂ — Gás Carbônico",     emoji: "🟣", sub: "Ambientes elétricos e precisão" },
  { id: "esp", label: "Espuma Mecânica",          emoji: "🟢", sub: "Líquidos inflamáveis e sólidos" },
];

const MANUT = 0.40;
const PO    = 0.60;

function fmt(n) {
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function buildSecoes() {
  let html = "";
  CARGAS.forEach(c => {
    html += `
    <div class="secao carga-${c.id}" id="secao-${c.id}">
      <div class="secao-header" onclick="toggleSecao('${c.id}')">
        <div class="secao-header-left">
          <span style="font-size:24px">${c.emoji}</span>
          <div>
            <div class="secao-title">${c.label}</div>
            <div class="secao-sub">${c.sub}</div>
          </div>
        </div>
        <button class="toggle-btn" id="togglebtn-${c.id}">▼ Expandir</button>
      </div>
      <div class="secao-body" id="body-${c.id}">
        <div class="qtd-row" style="margin-top:18px">
          <label>Quantidade de extintores:</label>
          <div class="qtd-ctrl">
            <button onclick="ajustar('${c.id}',-1);event.stopPropagation()">−</button>
            <input type="number" id="qtd-${c.id}" min="1" max="20" value="1"
              oninput="gerarCampos('${c.id}')">
            <button onclick="ajustar('${c.id}',1);event.stopPropagation()">+</button>
          </div>
        </div>
        <div class="campos-grid" id="campos-${c.id}"></div>
        <button class="btn-calc-secao" onclick="calcular('${c.id}')">⚡ Calcular ${c.label.split("—")[0].trim()}</button>
        <div class="resultado-secao" id="resultado-${c.id}"></div>
      </div>
    </div>`;
  });
  document.getElementById("secoes").innerHTML = html;
  CARGAS.forEach(c => gerarCampos(c.id));
}

function toggleSecao(id) {
  let body = document.getElementById(`body-${id}`);
  let btn  = document.getElementById(`togglebtn-${id}`);
  let open = body.classList.toggle("aberto");
  btn.textContent = open ? "▲ Recolher" : "▼ Expandir";
}

function ajustar(id, delta) {
  let el = document.getElementById(`qtd-${id}`);
  el.value = Math.max(1, Math.min(20, Number(el.value) + delta));
  gerarCampos(id);
}

function gerarCampos(id) {
  let qtd  = Math.max(1, Number(document.getElementById(`qtd-${id}`).value));
  let area = document.getElementById(`campos-${id}`);
  area.innerHTML = "";
  for (let i = 1; i <= qtd; i++) {
    area.innerHTML += `
      <div class="extintor-card">
        <h3 style="color:var(--accent-color)">🧯 Extintor ${i}</h3>
        <div class="field">
          <label>Descrição (opcional)</label>
          <input type="text" id="desc-${id}-${i}" placeholder="Ex: 6kg · Bloco A">
        </div>
        <div class="field">
          <label>Valor Total (R$)</label>
          <input type="number" id="valor-${id}-${i}" step="0.01" min="0" placeholder="Ex: 65,00">
        </div>
        <div class="field">
          <label>Peso (kg)</label>
          <input type="number" id="kg-${id}-${i}" step="0.01" min="0" placeholder="Ex: 6">
        </div>
      </div>`;
  }
  // limpa resultado ao regenerar campos
  document.getElementById(`resultado-${id}`).innerHTML = "";
}

function calcular(id) {
  let qtd  = Math.max(1, Number(document.getElementById(`qtd-${id}`).value));
  let dados = [];

  for (let i = 1; i <= qtd; i++) {
    let valor = parseFloat(document.getElementById(`valor-${id}-${i}`).value);
    let kg    = parseFloat(document.getElementById(`kg-${id}-${i}`).value);
    let desc  = document.getElementById(`desc-${id}-${i}`).value.trim();

    if (!valor || !kg || valor <= 0 || kg <= 0) {
      alert(`Preencha Valor e Peso do Extintor ${i} (${id.toUpperCase()}).`);
      return;
    }

    let po    = valor * PO;
    let manut = valor * MANUT;
    let poKg  = po / kg;
    dados.push({ valor, kg, desc, po, manut, poKg });
  }

  let menorPoKg  = Math.min(...dados.map(d => d.poKg));
  let totalValor = dados.reduce((a, d) => a + d.valor, 0);
  let totalManut = dados.reduce((a, d) => a + d.manut, 0);
  let totalPo    = dados.reduce((a, d) => a + d.po, 0);

  let rows = dados.map((d, i) => {
    let novoPoTotal = menorPoKg * d.kg;
    let novaManut   = d.valor - novoPoTotal;
    let isMenor     = Math.abs(d.poKg - menorPoKg) < 0.001;
    return { ...d, novoPoTotal, novaManut, isMenor, idx: i + 1 };
  });

  let saida = `
    <div class="info-bar">
      <div class="stat"><span>Extintores</span><span style="color:var(--accent-color)">${qtd}</span></div>
      <div class="stat"><span>Total Geral</span><span style="color:var(--accent-color)">${fmt(totalValor)}</span></div>
      <div class="stat"><span>Total Manutenção</span><span style="color:var(--green)">${fmt(totalManut)}</span></div>
      <div class="stat"><span>Total Pó/Recarga</span><span style="color:var(--yellow)">${fmt(totalPo)}</span></div>
      <div class="stat"><span>Menor Pó/kg</span><span style="color:var(--pink)">${fmt(menorPoKg)}/kg</span></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Descrição</th>
          <th>Valor Total</th>
          <th>Peso</th>
          <th>Pó (60%)</th>
          <th>Manutenção (40%)</th>
          <th>Pó/kg</th>
          <th>Pó (padr.)</th>
          <th>Manut. (padr.)</th>
        </tr>
      </thead>
      <tbody>`;

  rows.forEach(r => {
    saida += `
      <tr>
        <td style="color:var(--accent-color);font-weight:700">🧯 ${r.idx}</td>
        <td style="color:var(--muted);font-size:12px">${r.desc || "—"}</td>
        <td>${fmt(r.valor)}</td>
        <td>${r.kg} kg</td>
        <td><span class="tag tag-orange">${fmt(r.po)}</span></td>
        <td><span class="tag tag-green">${fmt(r.manut)}</span></td>
        <td>
          ${fmt(r.poKg)}/kg
          ${r.isMenor ? `<span class="menor-badge">★ menor</span>` : ""}
        </td>
        <td><span class="tag tag-pink">${fmt(r.novoPoTotal)}</span></td>
        <td><span class="tag tag-green">${fmt(r.novaManut)}</span></td>
      </tr>`;
  });

  saida += `</tbody></table>`;
  document.getElementById(`resultado-${id}`).innerHTML = saida;
  document.getElementById(`resultado-${id}`).scrollIntoView({ behavior: "smooth", block: "start" });
}

buildSecoes();
</script>
</body>
</html>
