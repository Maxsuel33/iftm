<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Extintores</title>
<style>
  :root {
    --primary: #ff6b35;
    --secondary: #f7c59f;
    --accent: #1a1a2e;
    --bg: #0f0f1a;
    --card: #1e1e30;
    --card2: #26263d;
    --text: #f0f0f0;
    --muted: #9090b0;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --border: #35355a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 36px;
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--primary), #e94e77);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  header h1 {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 800;
    background: linear-gradient(135deg, #ff6b35, #f7c59f, #e94e77);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }
  header p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 14px;
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 820px;
    margin: 0 auto 24px;
  }
  .card h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 span { font-size: 20px; }

  /* QTD ROW */
  .qtd-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .qtd-row label { color: var(--muted); font-size: 14px; }
  .qtd-ctrl {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .qtd-ctrl button {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 20px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    transition: background .2s;
  }
  .qtd-ctrl button:hover { background: var(--border); }
  .qtd-ctrl input {
    background: none;
    border: none;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    width: 50px;
    outline: none;
  }
  /* hide arrows */
  .qtd-ctrl input::-webkit-outer-spin-button,
  .qtd-ctrl input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* EXTINTORES GRID */
  #campos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .extintor-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    transition: border-color .2s;
  }
  .extintor-card:hover { border-color: var(--primary); }
  .extintor-card h3 {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 8px 10px;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: var(--primary); }
  .field input::placeholder { color: var(--border); }

  /* BOTÃO */
  .btn-calc {
    display: block;
    width: 100%;
    max-width: 820px;
    margin: 0 auto 28px;
    padding: 15px;
    background: linear-gradient(135deg, var(--primary), #e94e77);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity .2s, transform .1s;
    text-transform: uppercase;
  }
  .btn-calc:hover { opacity: .9; transform: translateY(-1px); }
  .btn-calc:active { transform: translateY(0); }

  /* RESULTADO */
  #resultado { max-width: 820px; margin: 0 auto; }

  .info-bar {
    background: linear-gradient(135deg, #1a2a1a, #1a1a2e);
    border: 1px solid #2a4a2a;
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    font-size: 13px;
  }
  .info-bar .stat { display: flex; flex-direction: column; gap: 2px; }
  .info-bar .stat span:first-child { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .info-bar .stat span:last-child { color: var(--green); font-weight: 700; font-size: 15px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  thead tr { background: linear-gradient(135deg, #2a1a30, #1a1a40); }
  th {
    padding: 12px 14px;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    white-space: nowrap;
  }
  tbody tr { border-top: 1px solid var(--border); transition: background .15s; }
  tbody tr:hover { background: var(--card2); }
  td { padding: 12px 14px; }
  td:first-child { color: var(--secondary); font-weight: 700; }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .tag-green { background: #0d2b1a; color: var(--green); border: 1px solid #1a4a2a; }
  .tag-orange { background: #2b1a0d; color: var(--yellow); border: 1px solid #4a2a1a; }
  .tag-highlight { background: #2b0d1a; color: #f472b6; border: 1px solid #5a1a3a; }
  .menor-badge {
    font-size: 10px;
    background: linear-gradient(135deg, var(--primary), #e94e77);
    color: #fff;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  @media(max-width:480px){
    th, td { padding: 10px 8px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="badge">🔥 Ferramenta Interna</div>
  <h1>Calculadora de Extintores</h1>
  <p>Manutenção · Recarga · Pó Químico por Kg</p>
</header>

<div class="card">
  <h2><span>🧯</span> Configurar Extintores</h2>
  <div class="qtd-row">
    <label>Quantidade de extintores:</label>
    <div class="qtd-ctrl">
      <button onclick="ajustar(-1)">−</button>
      <input type="number" id="qtd" min="1" max="20" value="1" oninput="gerarCampos()">
      <button onclick="ajustar(1)">+</button>
    </div>
  </div>
  <div id="campos"></div>
</div>

<button class="btn-calc" onclick="calcular()">⚡ Calcular Distribuição</button>

<div id="resultado"></div>

<script>
  const MANUT_PERC = 0.40; // 40% manutenção
  const PO_PERC   = 0.60; // 60% pó / recarga

  function ajustar(delta) {
    let el = document.getElementById("qtd");
    let v = Math.max(1, Math.min(20, Number(el.value) + delta));
    el.value = v;
    gerarCampos();
  }

  function gerarCampos() {
    let qtd = Math.max(1, Number(document.getElementById("qtd").value));
    let area = document.getElementById("campos");
    area.innerHTML = "";

    for (let i = 1; i <= qtd; i++) {
      area.innerHTML += `
        <div class="extintor-card">
          <h3>🧯 Extintor ${i}</h3>
          <div class="field">
            <label>Valor Total (R$)</label>
            <input type="number" id="valor${i}" step="0.01" min="0" placeholder="Ex: 65,00">
          </div>
          <div class="field">
            <label>Peso (kg)</label>
            <input type="number" id="kg${i}" step="0.01" min="0" placeholder="Ex: 6">
          </div>
        </div>`;
    }
  }

  function fmt(n) {
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  function calcular() {
    let qtd = Math.max(1, Number(document.getElementById("qtd").value));
    let dados = [];
    let valoresPoKg = [];

    for (let i = 1; i <= qtd; i++) {
      let valor = parseFloat(document.getElementById(`valor${i}`).value);
      let kg    = parseFloat(document.getElementById(`kg${i}`).value);

      if (!valor || !kg || valor <= 0 || kg <= 0) {
        alert(`Preencha corretamente os campos do Extintor ${i}.`);
        return;
      }

      let po    = valor * PO_PERC;       // 60% → pó/recarga
      let manut = valor * MANUT_PERC;    // 40% → manutenção
      let poKg  = po / kg;              // custo por kg

      dados.push({ valor, kg, po, manut, poKg });
      valoresPoKg.push(poKg);
    }

    let menorPoKg = Math.min(...valoresPoKg);
    let totalValor = dados.reduce((a, d) => a + d.valor, 0);
    let totalManut = dados.reduce((a, d) => a + d.manut, 0);
    let totalPo    = dados.reduce((a, d) => a + d.po, 0);

    // Recalcula com menor pó/kg padronizado
    let rows = dados.map((d, i) => {
      let novoPoTotal = menorPoKg * d.kg;
      let novaManut   = d.valor - novoPoTotal;
      let isMenor     = Math.abs(d.poKg - menorPoKg) < 0.001;
      return { ...d, novoPoTotal, novaManut, isMenor, idx: i + 1 };
    });

    let saida = `
      <div class="info-bar">
        <div class="stat"><span>Extintores</span><span>${qtd}</span></div>
        <div class="stat"><span>Total Geral</span><span>${fmt(totalValor)}</span></div>
        <div class="stat"><span>Total Manutenção</span><span>${fmt(totalManut)}</span></div>
        <div class="stat"><span>Total Pó/Recarga</span><span>${fmt(totalPo)}</span></div>
        <div class="stat"><span>Menor Pó por Kg</span><span>${fmt(menorPoKg)}/kg</span></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Valor Total</th>
            <th>Peso</th>
            <th>Pó (60%)</th>
            <th>Manutenção (40%)</th>
            <th>Pó por Kg</th>
            <th>Pó (padronizado)</th>
            <th>Manutenção (padr.)</th>
          </tr>
        </thead>
        <tbody>`;

    rows.forEach(r => {
      saida += `
        <tr>
          <td>🧯 ${r.idx}</td>
          <td>${fmt(r.valor)}</td>
          <td>${r.kg} kg</td>
          <td><span class="tag tag-orange">${fmt(r.po)}</span></td>
          <td><span class="tag tag-green">${fmt(r.manut)}</span></td>
          <td>
            ${fmt(r.poKg)}/kg
            ${r.isMenor ? '<span class="menor-badge">★ menor</span>' : ''}
          </td>
          <td><span class="tag tag-highlight">${fmt(r.novoPoTotal)}</span></td>
          <td><span class="tag tag-green">${fmt(r.novaManut)}</span></td>
        </tr>`;
    });

    saida += `
        </tbody>
      </table>
      <div class="legend">
        <span><i class="dot" style="background:var(--yellow)"></i> Pó original (60%)</span>
        <span><i class="dot" style="background:var(--green)"></i> Manutenção (40%)</span>
        <span><i class="dot" style="background:#f472b6"></i> Pó padronizado (menor $/kg)</span>
      </div>`;

    document.getElementById("resultado").innerHTML = saida;
    document.getElementById("resultado").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  gerarCampos();
</script>
</body>
</html>
